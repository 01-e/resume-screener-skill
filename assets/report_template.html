<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAI REN 智能简历筛选报告 — 风格三：柔彩粘土 × 液态玻璃风</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>

@font-face {
  font-family: "TencentSans";
  src: local("腾讯体 W7"), local("腾讯体W7"), local("腾讯体"), local("TencentSans W7"), local("TencentSansW7"), local("TencentSans-W7"), local("TencentSans");
  font-style: normal;
  font-weight: 400 900;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-weight: 400;
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
  font-variant-numeric: tabular-nums;
}

h1, h2, h3, .report-title, .detail-name, .score-num, .cand-score, .cand-rank, .detail-rank, .tab-badge, .weight-pill {
  font-family: "Nunito", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

/* Background Stage & TAI REN Tencent Font */
.bg-stage {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.brand-watermark {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 10vh;
  user-select: none;
}

.brand-sub {
  position: fixed;
  top: 150px;
  left: 50%;
  transform: translate(-50%, -50%) skewX(-10deg);
  font-family: "TencentSans", "Nunito", sans-serif;
  font-size: 0.9rem;
  letter-spacing: 0.28em;
  font-weight: 900;
  font-style: italic;
  white-space: nowrap;
  z-index: 0;
}

.brand-title {
  font-family: "TencentSans", "Nunito", sans-serif;
  font-size: clamp(6rem, 17.5vw, 17.5rem);
  font-weight: 900;
  font-style: italic;
  transform: skewX(-10deg);
  letter-spacing: 0.02em;
  padding-right: 0.14em;
  line-height: 0.92;
  white-space: nowrap;
}

/* App Shell */
.app-shell {
  max-width: 1420px;
  margin: 0 auto;
  padding: 20px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  transition: gap 0.34s cubic-bezier(0.22, 1, 0.36, 1);
}
.app-shell.is-compact {
  gap: 28px;
}
@media (min-width: 1025px) {
  .app-shell {
    height: 100vh;
    overflow: hidden;
  }
}

/* User's Exact Glassmorphism Core */
.glass-panel {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(20px) saturate(181%);
  -webkit-backdrop-filter: blur(20px) saturate(181%);
  border-radius: 37px;
  border: 0px solid rgba(255, 255, 255, 1);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
}

/* Topbar */
.topbar {
  position: relative;
  z-index: 30;
  padding: 22px 30px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: padding 0.34s cubic-bezier(0.22, 1, 0.36, 1), gap 0.34s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.34s cubic-bezier(0.22, 1, 0.36, 1);
}

.topbar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.eyebrow {
  font-family: "Nunito", "TencentSans", sans-serif;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 6px;
  max-height: 24px;
  overflow: hidden;
  transition: max-height 0.28s ease, opacity 0.22s ease, margin 0.28s ease;
}

.report-title {
  font-size: clamp(1.4rem, 2.3vw, 1.9rem);
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
  transition: font-size 0.34s cubic-bezier(0.22, 1, 0.36, 1), margin 0.34s ease;
}

.report-meta {
  font-size: 0.9rem;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: center;
  max-height: 44px;
  overflow: hidden;
  transition: max-height 0.28s ease, opacity 0.22s ease;
}
.report-meta b { font-weight: 700; }
.dot-sep { opacity: 0.45; }

.topbar-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 18px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
}
.action-btn svg { width: 17px; height: 17px; }

/* Compact Topbar State on Scroll */
.app-shell.is-compact .topbar {
  padding: 12px 26px 12px;
  gap: 10px;
  border-radius: 28px;
}
.app-shell.is-compact .eyebrow {
  max-height: 0;
  opacity: 0;
  margin-bottom: 0;
}
.app-shell.is-compact .report-title {
  font-size: 1.15rem;
  margin-bottom: 0;
}
.app-shell.is-compact .report-meta {
  max-height: 0;
  opacity: 0;
}
.app-shell.is-compact .action-btn {
  padding: 7px 14px;
  font-size: 0.84rem;
  border-radius: 14px;
}
.app-shell.is-compact .filter-tabs {
  padding: 4px;
}
.app-shell.is-compact .filter-tab {
  padding: 6px 13px;
  font-size: 0.86rem;
}
.app-shell.is-compact .search-wrap input,
.app-shell.is-compact .sort-select {
  padding-top: 7px;
  padding-bottom: 7px;
  font-size: 0.86rem;
}

/* Criteria Drawer */
.criteria-drawer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease;
  opacity: 0;
}
.criteria-drawer.open {
  max-height: 700px;
  opacity: 1;
}
.criteria-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--inner-border);
}
.criteria-col-title {
  font-family: "Nunito", sans-serif;
  font-size: 0.88rem;
  font-weight: 800;
  margin-bottom: 10px;
}
.criteria-list, .criteria-weights {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 0.88rem;
  line-height: 1.55;
}
.criteria-list li {
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--subcard-bg);
}
.criteria-weights li {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--subcard-bg);
}
.weight-pill {
  font-weight: 800;
  font-size: 0.85rem;
  padding: 2px 8px;
  border-radius: 8px;
  flex-shrink: 0;
}

/* Controls Row */
.topbar-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.filter-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 5px;
  border-radius: 20px;
  background: var(--subcard-bg);
}

.filter-tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 15px;
  border-radius: 15px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tab-badge {
  font-size: 0.78rem;
  font-weight: 800;
  padding: 1px 8px;
  border-radius: 10px;
}

.control-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  justify-content: flex-end;
  min-width: 260px;
}

.search-wrap {
  position: relative;
  flex: 1;
  max-width: 300px;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  pointer-events: none;
}
.search-wrap input {
  width: 100%;
  padding: 10px 14px 10px 40px;
  border-radius: 16px;
  font-family: inherit;
  font-size: 0.92rem;
  outline: none;
  transition: all 0.2s ease;
}

/* Custom Clay-Glass Sort Dropdown */
.sort-dropdown {
  position: relative;
}
.sort-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 164px;
  padding: 10px 16px;
  border-radius: 16px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.85);
  color: #524C5E;
  box-shadow: inset 3px 3px 8px rgba(160, 150, 190, 0.15), inset -3px -3px 8px rgba(255, 255, 255, 0.9);
}
.sort-trigger svg {
  width: 15px;
  height: 15px;
  opacity: 0.65;
  transition: transform 0.22s ease;
}
.sort-dropdown.open .sort-trigger svg {
  transform: rotate(180deg);
}
.app-shell.is-compact .sort-trigger {
  padding: 7px 14px;
  font-size: 0.86rem;
}
.sort-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: 100%;
  padding: 5px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12), inset 2px 2px 6px rgba(255, 255, 255, 0.9);
  opacity: 0;
  transform: translateY(-6px) scale(0.97);
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 50;
}
.sort-dropdown.open .sort-menu {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.sort-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 7px 11px;
  border: none;
  border-radius: 12px;
  background: transparent;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  color: #524C5E;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: left;
}
.sort-option:hover {
  background: rgba(237, 233, 254, 0.55);
  color: #6D28D9;
}
.sort-option.active {
  background: #EDE9FE;
  color: #5B21B6;
  font-weight: 700;
}
.sort-option svg {
  width: 14px;
  height: 14px;
}

/* Master-Detail Workspace */
.workspace {
  display: grid;
  grid-template-columns: 390px minmax(0, 1fr);
  gap: 24px;
  align-items: stretch;
  flex: 1;
  min-height: 0;
}

.list-pane, .detail-pane {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.pane-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.list-pane .pane-scroll {
  margin: 14px 10px 14px 0;
  padding: 14px 10px 18px 18px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22px, #000 calc(100% - 22px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 22px, #000 calc(100% - 22px), transparent 100%);
}

.detail-pane .pane-scroll {
  margin: 16px 12px 16px 0;
  padding: 14px 24px 18px 36px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 18px, #000 calc(100% - 18px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 18px, #000 calc(100% - 18px), transparent 100%);
}

.cand-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.cand-item {
  padding: 16px 18px;
  border-radius: 22px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
  background: var(--subcard-bg);
}

.cand-item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.cand-item-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex-wrap: wrap;
}

.cand-rank {
  font-size: 0.85rem;
  font-weight: 800;
  opacity: 0.65;
}

.cand-name {
  font-size: 1.08rem;
  font-weight: 700;
}

.cand-score {
  font-size: 1.05rem;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 12px;
  flex-shrink: 0;
}

.cand-item-meta {
  font-size: 0.84rem;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
  opacity: 0.82;
}

.cand-item-snippet {
  font-size: 0.88rem;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  opacity: 0.88;
}

/* Status Pills */
.status-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 999px;
  font-family: "Nunito", sans-serif;
  font-size: 0.76rem;
  font-weight: 700;
}

/* Right Detail Pane */
.detail-pane {
  min-height: 0;
}

.detail-inner {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.detail-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.detail-rank {
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.detail-name {
  font-size: 1.85rem;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 8px;
}

.detail-basics {
  font-size: 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: center;
}

.detail-score-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 96px;
  padding: 14px 18px;
  border-radius: 24px;
  flex-shrink: 0;
}
.score-num {
  font-size: 2.1rem;
  font-weight: 900;
  line-height: 1;
}
.score-label {
  font-size: 0.74rem;
  margin-top: 4px;
  opacity: 0.85;
}

.detail-meta-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 18px;
  background: var(--subcard-bg);
}

.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.86rem;
  opacity: 0.85;
}
.file-chip svg { width: 16px; height: 16px; flex-shrink: 0; }
.file-chip span { font-family: "SF Mono", Consolas, monospace; word-break: break-all; }

.contact-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.contact-text { font-size: 0.9rem; font-weight: 500; }

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.copy-btn svg { width: 14px; height: 14px; }

.detail-summary-card {
  padding: 20px 24px;
  border-radius: 22px;
  background: var(--subcard-bg);
}

.section-heading {
  font-family: "Nunito", sans-serif;
  font-size: 0.92rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 12px;
  opacity: 0.8;
}

.summary-text {
  font-size: 1.06rem;
  font-weight: 400;
  line-height: 1.75;
}

/* Insights Grid */
.insights-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.insight-box {
  padding: 16px 18px;
  border-radius: 20px;
  background: var(--subcard-bg);
}
.insight-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: "Nunito", sans-serif;
  font-size: 0.92rem;
  font-weight: 800;
  margin-bottom: 10px;
}
.insight-title svg { width: 17px; height: 17px; }
.insight-box ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 0.94rem;
  line-height: 1.6;
}
.insight-box li {
  position: relative;
  padding-left: 14px;
}
.insight-box li::before {
  content: "•";
  position: absolute;
  left: 0;
  font-weight: 700;
}

/* Dimensions */
.dim-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dim-card {
  padding: 16px 20px;
  border-radius: 18px;
  background: var(--subcard-bg);
}
.dim-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.dim-name {
  font-size: 0.96rem;
  font-weight: 600;
  line-height: 1.45;
}
.dim-score-pill {
  font-family: "Nunito", sans-serif;
  font-size: 0.9rem;
  font-weight: 800;
  padding: 2px 10px;
  border-radius: 10px;
  flex-shrink: 0;
}
.dim-bar-track {
  height: 7px;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 10px;
  background: var(--track-bg);
}
.dim-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.4s ease;
}
.dim-note-text {
  font-size: 0.95rem;
  font-weight: 400;
  line-height: 1.65;
  opacity: 0.9;
}

/* Evidence */
.evidence-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.evidence-chip {
  padding: 9px 14px;
  border-radius: 14px;
  font-size: 0.9rem;
  line-height: 1.5;
  background: var(--subcard-bg);
}

/* Abnormal & Empty */
.empty-panel, .abnormal-panel {
  padding: 40px 32px;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  opacity: 0.7;
  font-size: 1rem;
}
.empty-state svg { width: 42px; height: 42px; margin-bottom: 12px; }

/* Scrollbar */
.pane-scroll::-webkit-scrollbar { width: 6px; }
.pane-scroll::-webkit-scrollbar-track { background: transparent; }
.pane-scroll::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(124, 58, 237, 0.22); }
.pane-scroll::-webkit-scrollbar-thumb:hover { background: rgba(124, 58, 237, 0.38); }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 10px 22px;
  border-radius: 14px;
  font-size: 0.9rem;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Responsive */
@media (max-width: 1024px) {
  .workspace { grid-template-columns: 1fr; }
  .list-pane { max-height: 420px; }
  .detail-pane { height: auto; }
  .criteria-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .app-shell { padding: 14px 14px 36px; }
  .topbar, .detail-pane { padding: 20px; border-radius: 26px; }
  .glass-panel { border-radius: 26px; }
  .detail-header { flex-direction: column; }
}

@media print {
  .bg-stage, .topbar-actions, .topbar-controls, .list-pane, .copy-btn, .toast { display: none !important; }
  body { background: #fff !important; color: #111 !important; }
  .glass-panel { background: #fff !important; box-shadow: none !important; backdrop-filter: none !important; border: 1px solid #ddd !important; border-radius: 12px !important; }
  .workspace { display: block; }
}


/* 风格三：柔彩粘土 × 液态玻璃风 (Clay-Glass Hybrid) */
:root {
  --text-main: #2E293A;
  --text-muted: #5E586B;
  --subcard-bg: rgba(255, 255, 255, 0.56);
  --inner-border: rgba(124, 58, 237, 0.12);
  --track-bg: rgba(124, 58, 237, 0.1);
  --accent-green: #10B981;
  --accent-amber: #F59E0B;
  --accent-gray: #94A3B8;

function esc(str) {
  if (str == null) return '';
  const el = document.createElement('span');
  el.textContent = String(str);
  return el.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.classList.add('copied');
  const lbl = btn.querySelector('.copy-label');
  if (lbl) lbl.textContent = '已复制';
  showToast('联系方式已复制到剪贴板');
  setTimeout(() => {
    btn.classList.remove('copied');
    if (lbl) lbl.textContent = '复制联系方式';
  }, 1500);
}

}

let activeTab = 'all';

let sortBy = 'score';

function getFilteredCandidates() {
  let list = [...D.candidates];
  if (activeTab === 'recommended') list = list.filter(c => c.status === 'recommended');
  else if (activeTab === 'pending') list = list.filter(c => c.status === 'pending');
  else if (activeTab === 'rejected') list = list.filter(c => c.status === 'rejected');
  else if (activeTab === 'abnormal') return [];

  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(c => {
      const haystack = [
        c.name, c.filename, c.phone, c.email, c.education, c.latest_role, c.comment,
        ...(c.highlights || []), ...(c.risks || []), ...(c.gaps || []),
        ...(c.dimensions || []).map(d => d.name + ' ' + d.note),
        ...(c.evidence || [])
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }

  if (sortBy === 'years') {
    list.sort((a, b) => (b.years ?? -1) - (a.years ?? -1));
  } else {
    list.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  }
  return list;
}

function render() {
  const app = document.getElementById('app');
  const nRec = countByStatus(D.candidates, 'recommended');
  const nPen = countByStatus(D.candidates, 'pending');
  const nRej = countByStatus(D.candidates, 'rejected');
  const nAbn = D.abnormal_files.length;
  const total = D.meta.total_files_scanned;
  const valid = D.meta.valid_parsed;

  const filtered = getFilteredCandidates();
  if (filtered.length > 0 && !filtered.some(c => c.filename === selectedFilename)) {
    selectedFilename = filtered[0].filename;
  }

  const selectedCandidate = filtered.find(c => c.filename === selectedFilename) || filtered[0] || null;

  app.innerHTML = `
    <header class="glass-panel topbar">
      <div class="topbar-head">
        <div class="topbar-title-group">
          <div class="eyebrow">TAI REN · TALENT REVIEW WORKBENCH</div>
          <h1 class="report-title">${esc(D.meta.job_title)}</h1>
          <div class="report-meta">
            <span>筛选时间：${esc(D.meta.screening_time)}</span>
            <span class="dot-sep">·</span>
            <span>扫描 <b>${total}</b> 份</span>
            <span class="dot-sep">·</span>
            <span>有效 <b>${valid}</b> 份</span>
            ${D.meta.source_summary ? `<span class="dot-sep">·</span><span>${esc(D.meta.source_summary)}</span>` : ''}
          </div>
        </div>
        <div class="topbar-actions">
          <button class="action-btn ${criteriaOpen ? 'active' : ''}" onclick="toggleCriteria()">
            ${ICONS.sliders}
            <span>筛选口径</span>
          </button>
          <button class="action-btn" onclick="window.print()">
            ${ICONS.print}
            <span>导出 PDF</span>
          </button>
        </div>
      </div>

      <div class="criteria-drawer ${criteriaOpen ? 'open' : ''}" id="criteriaDrawer">
        <div class="criteria-grid">
          <div class="criteria-col">
            <div class="criteria-col-title">硬门槛（一票否决）</div>
            <ul class="criteria-list">
              ${D.criteria.hard_requirements.map(r => `<li>${esc(r)}</li>`).join('')}
            </ul>
          </div>
          <div class="criteria-col">
            <div class="criteria-col-title">HR 补充隐性口径</div>
            <ul class="criteria-list">
              ${D.criteria.hidden_requirements.map(r => `<li>${esc(r)}</li>`).join('')}
            </ul>
          </div>
          <div class="criteria-col">
            <div class="criteria-col-title">核心评估维度与权重</div>
            <ul class="criteria-weights">
              ${D.criteria.dimensions.map(d => `
                <li><span>${esc(d.name)}</span><span class="weight-pill">${d.weight}%</span></li>
              `).join('')}
            </ul>
          </div>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="filter-tabs">
          ${renderTabBtn('all', '全部', valid + nAbn)}
          ${renderTabBtn('recommended', '强烈推荐', nRec)}
          ${renderTabBtn('pending', '待定复核', nPen)}
          ${renderTabBtn('rejected', '暂不匹配', nRej)}
          ${renderTabBtn('abnormal', '异常文件', nAbn)}
        </div>
        <div class="control-right">
          <div class="search-wrap">
            ${ICONS.search}
            <input type="text" placeholder="搜索姓名、文件名、技能、原文…" value="${esc(searchQuery).replaceAll('"', '&quot;')}" oninput="onSearch(this.value)">
          </div>
          <div class="sort-dropdown" id="sortDropdown">
            <button type="button" class="sort-trigger" onclick="toggleSortMenu(event)">
              <span id="sortLabel">${sortBy === 'years' ? '按工作年限排序' : '按匹配度排序'}</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="sort-menu">
              <button type="button" class="sort-option ${sortBy === 'score' ? 'active' : ''}" onclick="selectSort('score')">
                <span>按匹配度排序</span>
                ${sortBy === 'score' ? ICONS.check : ''}
              </button>
              <button type="button" class="sort-option ${sortBy === 'years' ? 'active' : ''}" onclick="selectSort('years')">
                <span>按工作年限排序</span>
                ${sortBy === 'years' ? ICONS.check : ''}
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    ${activeTab === 'abnormal' ? renderAbnormalView() : `
    <main class="workspace">
      <aside class="glass-panel list-pane">
        <div class="pane-scroll" id="listPane">${renderCandidateList(filtered)}</div>
      </aside>
      <section class="glass-panel detail-pane">
        <div class="pane-scroll" id="detailPane">${renderCandidateDetail(selectedCandidate, filtered)}</div>
      </section>
    </main>
    `}
  `;
}

function renderTabBtn(id, label, count) {
  return `<button class="filter-tab ${activeTab === id ? 'active' : ''}" onclick="switchTab('${id}')">
    <span>${esc(label)}</span>
    <span class="tab-badge">${count}</span>
  </button>`;
}

function renderCandidateList(list) {
  if (list.length === 0) {
    return '';
  }
  return `<div class="cand-list">${list.map((c, idx) => {
    const isActive = c.filename === selectedFilename;
    return `
      <div class="cand-item ${isActive ? 'active' : ''}" onclick="selectCandidate('${esc(c.filename).replaceAll("'", "\\'")}')">
        <div class="cand-item-top">
          <div class="cand-item-left">
            <span class="cand-rank">#${String(idx + 1).padStart(2, '0')}</span>
            <span class="cand-name">${esc(c.name)}</span>
            <span class="status-pill ${badgeClass(c.status)}">${badgeLabel(c.status)}</span>
          </div>
          <div class="cand-score ${scoreClass(c.status)}">${c.score ?? '—'}</div>
        </div>
        <div class="cand-item-meta">
          <span>${c.years == null ? '年限未提及' : c.years + ' 年'}</span>
          <span>·</span>
          <span>${esc(c.education)}</span>
          <span>·</span>
          <span>${esc(c.latest_role)}</span>
        </div>
        <div class="cand-item-snippet">${esc(c.comment)}</div>
      </div>
    `;
  }).join('')}</div>`;
}

function renderCandidateDetail(c, list) {
  if (!c) {
    return '';
  }
  const rank = list.findIndex(item => item.filename === c.filename) + 1;
  const contactText = [c.phone, c.email].filter(Boolean).join(' / ');

  return `
    <div class="detail-inner">
      <div class="detail-header">
        <div class="detail-title-block">
          <div class="detail-kicker">
            <span class="detail-rank">RANK #${String(rank).padStart(2, '0')}</span>
            <span class="status-pill ${badgeClass(c.status)}">${badgeLabel(c.status)}</span>
          </div>
          <h2 class="detail-name">${esc(c.name)}</h2>
          <div class="detail-basics">
            <span>${c.years == null ? '工作年限未提及' : c.years + ' 年工作经验'}</span>
            <span class="dot-sep">·</span>
            <span>${esc(c.education)}</span>
            <span class="dot-sep">·</span>
            <span>${esc(c.latest_role)}</span>
          </div>
        </div>
        <div class="detail-score-box ${scoreClass(c.status)}">
          <div class="score-num">${c.score ?? '—'}</div>
          <div class="score-label">综合匹配分</div>
        </div>
      </div>

      <div class="detail-meta-bar">
        <div class="file-chip">${ICONS.file}<span>${esc(c.filename)}</span></div>
        ${contactText ? `
          <div class="contact-actions">
            <span class="contact-text">${esc(contactText)}</span>
            <button class="copy-btn" data-contact="${esc(contactText).replaceAll('"', '&quot;')}" onclick="copyText(this.dataset.contact, this)">
              ${ICONS.copy}<span class="copy-label">复制联系方式</span>
            </button>
          </div>
        ` : ''}
      </div>

      <div class="detail-summary-card">
        <div class="section-heading">AI 综合评估结论</div>
        <p class="summary-text">${esc(c.comment)}</p>
      </div>

      <div class="insights-grid">
        ${(c.highlights && c.highlights.length) ? `
          <div class="insight-box insight-green">
            <div class="insight-title">${ICONS.check}<span>核心亮点</span></div>
            <ul>${c.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
          </div>
        ` : ''}
        ${(c.risks && c.risks.length) ? `
          <div class="insight-box insight-amber">
            <div class="insight-title">${ICONS.alert}<span>潜在风险</span></div>
            <ul>${c.risks.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
          </div>
        ` : ''}
        ${(c.gaps && c.gaps.length) ? `
          <div class="insight-box insight-gray">
            <div class="insight-title">${ICONS.gap}<span>待核实缺口</span></div>
            <ul>${c.gaps.map(g => `<li>${esc(g)}</li>`).join('')}</ul>
          </div>
        ` : ''}
      </div>

      <div class="detail-section">
        <div class="section-heading">五维能力拆解</div>
        <div class="dim-list">
          ${(c.dimensions || []).map(d => `
            <div class="dim-card">
              <div class="dim-card-top">
                <span class="dim-name">${esc(d.name)}</span>
                <span class="dim-score-pill">${d.score} 分</span>
              </div>
              <div class="dim-bar-track">
                <div class="dim-bar-fill" style="width:${d.score}%; background:${dimBarColor(d.score)}"></div>
              </div>
              <p class="dim-note-text">${esc(d.note)}</p>
            </div>
          `).join('')}
        </div>
      </div>

      ${(c.evidence && c.evidence.length) ? `
        <div class="detail-section">
          <div class="section-heading">简历原文事实依据</div>
          <div class="evidence-grid">
            ${c.evidence.map(e => `<div class="evidence-chip">${esc(e)}</div>`).join('')}
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function renderAbnormalView() {
  if (D.abnormal_files.length === 0) {
    return `<div class="glass-panel empty-panel" style="flex:1;min-height:360px;"></div>`;
  }
  return `<div class="glass-panel abnormal-panel">${D.abnormal_files.map(f => `
    <div class="abnormal-row">
      <div class="abnormal-icon">${ICONS.alert}</div>
      <div>
        <div class="abnormal-name">${esc(f.filename)} <span>${esc(f.file_type)}</span></div>
        <div class="abnormal-reason">${esc(f.reason)}</div>
        <div class="abnormal-action">${esc(f.suggestion)}</div>
      </div>
    </div>
  `).join('')}</div>`;
}

function switchTab(tab) {
  activeTab = tab;
  renderAndBind();
  restoreSearchFocus();
}

function onSearch(val) {
  searchQuery = val;
  renderListAndDetail();
}

function onSort(val) {
  sortBy = val;
  renderListAndDetail();
}

function toggleSortMenu(e) {
  e.stopPropagation();
  const dd = document.getElementById('sortDropdown');
  if (dd) dd.classList.toggle('open');
}

function selectSort(val) {
  sortBy = val;
  const dd = document.getElementById('sortDropdown');
  if (dd) dd.classList.remove('open');
  renderAndBind();
}

if (!window._sortOutsideBound) {
  window._sortOutsideBound = true;
  document.addEventListener('click', (e) => {
    const dd = document.getElementById('sortDropdown');
    if (dd && !dd.contains(e.target)) dd.classList.remove('open');
  });
}

function selectCandidate(filename) {
  selectedFilename = filename;
  renderListAndDetail();
  const detailPane = document.getElementById('detailPane');
  if (detailPane) detailPane.scrollTop = 0;
}

function toggleCriteria() {
  criteriaOpen = !criteriaOpen;
  const drawer = document.getElementById('criteriaDrawer');
  const btn = document.querySelector('.topbar-actions .action-btn');
  if (drawer) drawer.classList.toggle('open', criteriaOpen);
  if (btn) btn.classList.toggle('active', criteriaOpen);
}

function renderListAndDetail() {
  if (activeTab === 'abnormal') return;
  const filtered = getFilteredCandidates();
  if (filtered.length > 0 && !filtered.some(c => c.filename === selectedFilename)) {
    selectedFilename = filtered[0].filename;
  }
  const selected = filtered.find(c => c.filename === selectedFilename) || filtered[0] || null;
  const listPane = document.getElementById('listPane');
  const detailPane = document.getElementById('detailPane');
  if (listPane) listPane.innerHTML = renderCandidateList(filtered);
  if (detailPane) detailPane.innerHTML = renderCandidateDetail(selected, filtered);
}

function restoreSearchFocus() {
  if (!searchQuery) return;
  const inp = document.querySelector('.search-wrap input');
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  }
}

let isCompact = false;
let compactLockUntil = 0;

function setCompact(next) {
  if (next === isCompact) return;
  const now = Date.now();
  if (now < compactLockUntil) return;
  compactLockUntil = now + 360;
  isCompact = next;
  const app = document.getElementById('app');
  if (app) app.classList.toggle('is-compact', isCompact);
}

function bindScrollCompact() {
  const listPane = document.getElementById('listPane');
  const detailPane = document.getElementById('detailPane');
  const attach = (el) => {
    if (!el) return;
    let lastTop = el.scrollTop;
    el.addEventListener('scroll', () => {
      const top = el.scrollTop;
      const goingDown = top > lastTop;
      const goingUp = top < lastTop;
      lastTop = top;
      if (goingDown && top > 24) {
        setCompact(true);
      } else if (goingUp && top <= 2) {
        const other = el === listPane ? detailPane : listPane;
        if (!other || other.scrollTop <= 2) setCompact(false);
      }
    }, { passive: true });
  };
  attach(listPane);
  attach(detailPane);
}

if (!window._wheelCompactBound) {
  window._wheelCompactBound = true;
  window.addEventListener('wheel', (e) => {
    if (window.innerWidth <= 1024) return;
    if (e.deltaY > 6) {
      setCompact(true);
    } else if (e.deltaY < -6) {
      const listPane = document.getElementById('listPane');
      const detailPane = document.getElementById('detailPane');
      const listAtTop = !listPane || listPane.scrollTop <= 4;
      const detailAtTop = !detailPane || detailPane.scrollTop <= 4;
      if (listAtTop && detailAtTop) setCompact(false);
    }
  }, { passive: true });
}

function renderAndBind() {
  render();
  const app = document.getElementById('app');
  if (app && isCompact) app.classList.add('is-compact');
  bindScrollCompact();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderAndBind);
} else {
  renderAndBind();
}
</script>

</body>
</html>
